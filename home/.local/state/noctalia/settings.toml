[plugins]
enabled = [
    "nomadcxx/gamer-mode",
    "damian-ds7/battery-threshold",
    "baizhu/asus-gpu-mode",
    "felipeartur/ai-usagebar",
    "local/wallpaper-hub",
    "local/ai-chat"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "__HOME__/.config/noctalia/local-plugins"
    name = "local"

[shell.launcher]
app_grid = true
default_view = "all"
show_app_origin_indicator = false
show_navigation_labels = false
show_session_button = false
show_settings_button = false

[theme]
builtin = "Noctalia"
community_palette = "Koneko"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
transition_on_startup = true

