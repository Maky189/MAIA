# Dedicated terminal profile for the Ubuntu Distrobox launcher.
[env]
TERM = "xterm-256color"

[window]
title = "Ubuntu"
dynamic_title = false
class = { instance = "ubuntu-distrobox", general = "ubuntu-distrobox" }
dimensions = { columns = 110, lines = 32 }
padding = { x = 16, y = 14 }
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 1.0

[font]
normal = { family = "Noto Sans Mono", style = "Regular" }
size = 12.0

[scrolling]
history = 20000

[cursor]
style = { shape = "Block", blinking = "Off" }

[colors.primary]
background = "#300A24"
foreground = "#EEEEEC"

[colors.cursor]
text = "#300A24"
cursor = "#E95420"

[colors.selection]
text = "#FFFFFF"
background = "#772953"

[colors.normal]
black = "#2E3436"
red = "#CC0000"
green = "#4E9A06"
yellow = "#C4A000"
blue = "#3465A4"
magenta = "#75507B"
cyan = "#06989A"
white = "#D3D7CF"

[colors.bright]
black = "#555753"
red = "#EF2929"
green = "#8AE234"
yellow = "#FCE94F"
blue = "#729FCF"
magenta = "#AD7FA8"
cyan = "#34E2E2"
white = "#EEEEEC"
